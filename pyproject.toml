[project]
name = "eventide"
version = "0.1.0"
description = "Sistema neuro-simbólico multi-agente para recuperacion semantica y planificacion personalizada de eventos"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Melani Forsythe Matos" },
    { name = "Olivia Ibanez Mustelier" },
    { name = "Orlando De La Torre Leal" },
]

dependencies = [
    "flask>=3.0",
    "requests>=2.31",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "sentence-transformers>=2.5",
    "faiss-cpu>=1.7.4",
    "numpy>=1.26,<2.0",
    "networkx>=3.2",
    "geopy>=2.4",
    "python-dateutil>=2.9",
    "scipy>=1.12",
    "streamlit>=1.35",
    "google-generativeai>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.3",
    "black>=24.0",
    "mypy>=1.9",
    "pre-commit>=3.6",
]

[project.scripts]
eventide = "eventide.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eventide"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/eventide"]
omit = ["*/tests/*", "*/__main__.py"]